[package]
name = "vibe-voice"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "macOS Companion for Vibe Voice input on the FoloToy AI Passport"
license = "MIT"
publish = false

[lib]
name = "vibe_voice"
path = "src/lib.rs"

[[bin]]
name = "vibe-voice"
path = "src/main.rs"

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
uuid = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
btleplug = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-speech = "0.3"
objc2-avf-audio = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-application-services = "0.3"

[profile.release]
lto = "thin"
strip = true
